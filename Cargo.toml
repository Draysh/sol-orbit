[package]
name = "orbit"
description = "The SDK every Sol app is built on: server bootstrap, auth, SQLite, events and the web UI"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Draysh/sol-orbit"
publish = false

# Its own workspace, so it builds the same inside or outside a checkout of Sol.
[workspace]

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6", features = ["derive", "env"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6"
rust-embed = { version = "8.12", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "catch-panic", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1.27", features = ["v7", "serde"] }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
tower = "0.5.3"
http-body-util = "0.1.5"
